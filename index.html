<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Minimal Seat Logic</title>
  <style>
    @import url('https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css');

    :root {
      --bg: #050505;
      --surface: #121212;
      --accent: #ffffff;
      --secondary: #888888;
      --border: rgba(255, 255, 255, 0.1);
      --cell-size: 52px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-font-smoothing: antialiased;
    }

    body {
      background-color: var(--bg);
      color: var(--accent);
      font-family: 'Pretendard', sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      padding: 60px 20px;
      letter-spacing: -0.02em;
    }

    /* 배경 은은한 빛 */
    body::after {
      content: "";
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: radial-gradient(circle at 50% -20%, #1a1a2e 0%, transparent 50%);
      z-index: -1;
      pointer-events: none;
    }

    h1 {
      font-weight: 300;
      font-size: 24px;
      letter-spacing: 0.2em;
      margin-bottom: 40px;
      color: var(--accent);
    }

    /* 상단 컨트롤바 - 미니멀 라인 스타일 */
    .controls {
      display: flex;
      gap: 30px;
      margin-bottom: 50px;
      padding-bottom: 20px;
      border-bottom: 1px solid var(--border);
    }

    .input-item {
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-item label {
      font-size: 11px;
      text-transform: uppercase;
      color: var(--secondary);
      letter-spacing: 0.1em;
    }

    input[type=number] {
      background: transparent;
      border: none;
      border-bottom: 1px solid transparent;
      color: var(--accent);
      font-size: 16px;
      width: 40px;
      outline: none;
      transition: border-color 0.3s;
      text-align: center;
      font-weight: 500;
    }

    input[type=number]:focus {
      border-bottom-color: var(--accent);
    }

    .btn-main {
      background: var(--accent);
      color: var(--bg);
      border: none;
      padding: 10px 24px;
      border-radius: 2px;
      font-size: 13px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.3s;
      margin-left: 20px;
    }

    .btn-main:hover {
      opacity: 0.8;
      transform: translateY(-1px);
    }

    /* 전면(칠판) 표시 */
    .front-label {
      font-size: 10px;
      letter-spacing: 0.4em;
      color: var(--secondary);
      margin-bottom: 60px;
      position: relative;
    }

    .front-label::after {
      content: "";
      position: absolute;
      bottom: -10px;
      left: 50%;
      transform: translateX(-50%);
      width: 40px;
      height: 1px;
      background: var(--border);
    }

    /* 그리드 보드 */
    #board {
      display: grid;
      gap: 12px;
      margin-bottom: 40px;
    }

    .cell {
      width: var(--cell-size);
      height: var(--cell-size);
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 4px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 15px;
      font-weight: 300;
      cursor: pointer;
      transition: all 0.5s cubic-bezier(0.2, 1, 0.3, 1);
    }

    .cell:hover {
      background: #1a1a1a;
      border-color: rgba(255,255,255,0.3);
    }

    .cell.fixed {
      background: var(--accent);
      color: var(--bg);
      border: none;
      font-weight: 600;
      box-shadow: 0 0 20px rgba(255,255,255,0.2);
    }

    .cell.disabled {
      background: transparent;
      border: 1px solid #101010;
      color: #222;
      cursor: default;
    }

    /* 셔플 버튼 */
    .btn-shuffle {
      background: transparent;
      border: 1px solid var(--border);
      color: var(--accent);
      padding: 14px 40px;
      font-size: 12px;
      letter-spacing: 0.2em;
      cursor: pointer;
      transition: all 0.3s;
      border-radius: 2px;
      margin-top: 20px;
    }

    .btn-shuffle:hover {
      background: var(--accent);
      color: var(--bg);
    }

    #counter {
      margin-top: 30px;
      font-size: 11px;
      color: var(--secondary);
      letter-spacing: 0.1em;
    }

    /* 숫자 변경 시 애니메이션 */
    .fade-in {
      animation: fadeIn 0.4s ease-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(5px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <h1>SEAT LOGIC</h1>

  <div class="controls">
    <div class="input-item">
      <label>Rows</label>
      <input type="number" id="rows" value="5">
    </div>
    <div class="input-item">
      <label>Cols</label>
      <input type="number" id="cols" value="6">
    </div>
    <div class="input-item">
      <label>Voids</label>
      <input type="number" id="disabledSeats" value="0">
    </div>
    <button class="btn-main" onclick="generateBoard()">INITIALIZE</button>
  </div>

  <div class="front-label">SCREEN</div>

  <div id="board"></div>

  <button class="btn-shuffle" onclick="randomizeBoard()" id="randomBtn" style="display:none;">
    SHUFFLE
  </button>
  
  <div id="counter" style="display:none;">
    SEQUENTIAL_INDEX: <span id="countVal">0</span>
  </div>

  <script>
    let rows = 0, cols = 0, disabledSeats = 0, count = 0;
    let manualAssignments = {};

    function generateBoard() {
      rows = parseInt(document.getElementById("rows").value);
      cols = parseInt(document.getElementById("cols").value);
      disabledSeats = parseInt(document.getElementById("disabledSeats").value);

      const board = document.getElementById("board");
      board.innerHTML = "";
      board.style.gridTemplateColumns = `repeat(${cols}, var(--cell-size))`;

      const totalSeats = rows * cols;
      for (let i = 0; i < totalSeats; i++) {
        const cell = document.createElement("div");
        cell.className = "cell";
        cell.dataset.index = i;
        cell.addEventListener("click", () => handleCellClick(i));
        board.appendChild(cell);
      }

      const cells = document.querySelectorAll(".cell");
      for (let i = 0; i < disabledSeats; i++) {
        const index = totalSeats - 1 - i;
        if(cells[index]) cells[index].classList.add("disabled");
      }

      manualAssignments = {};
      count = 0;
      document.getElementById("counter").style.display = "block";
      document.getElementById("countVal").textContent = "0";
      document.getElementById("randomBtn").style.display = "block";
    }

    function handleCellClick(index) {
      const cell = document.querySelectorAll(".cell")[index];
      if (cell.classList.contains("disabled")) return;

      if (manualAssignments[index] !== undefined) {
        delete manualAssignments[index];
        cell.textContent = "";
        cell.classList.remove("fixed");
      } else {
        const num = prompt("FIX ID:");
        if (!num) return;
        const number = parseInt(num);
        if (isNaN(number)) return;

        if (Object.values(manualAssignments).includes(number)) {
          alert("Duplicate ID exists.");
          return;
        }

        manualAssignments[index] = number;
        cell.textContent = number;
        cell.classList.add("fixed");
      }
    }

    function shuffle(array) {
      for (let i = array.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [array[i], array[j]] = [array[j], array[i]];
      }
      return array;
    }

    function getNeighborIndexes(index) {
      const row = Math.floor(index / cols);
      const col = index % cols;
      const neighbors = [];

      for (let r = row - 1; r <= row + 1; r++) {
        for (let c = col - 1; c <= col + 1; c++) {
          if (r === row && c === col) continue;
          if (r < 0 || r >= rows || c < 0 || c >= cols) continue;
          neighbors.push(r * cols + c);
        }
      }

      return neighbors;
    }

    function getSideNeighborIndexes(index) {
      const row = Math.floor(index / cols);
      const col = index % cols;
      const neighbors = [];

      if (col - 1 >= 0) neighbors.push(row * cols + (col - 1));
      if (col + 1 < cols) neighbors.push(row * cols + (col + 1));

      return neighbors;
    }

    function getValid22Spots(cells, fixedIndexes) {
      const valid22Spots = [];
      const secondBottomStart = Math.max(0, (rows - 2) * cols);
      const excludedIndexes = new Set();

      if (rows === 6 && cols === 6) {
        excludedIndexes.add((rows * cols) - 4);
      }

      if (rows >= 2 && cols >= 5) {
        const upperBottomRowStart = (rows - 2) * cols;
        excludedIndexes.add(upperBottomRowStart + 2);
        excludedIndexes.add(upperBottomRowStart + 4);
      }

      for (let i = secondBottomStart; i < rows * cols; i++) {
        if (excludedIndexes.has(i)) continue;
        if (cells[i].classList.contains("disabled")) continue;
        if (fixedIndexes.includes(i)) continue;
        valid22Spots.push(i);
      }

      return valid22Spots;
    }

    function placeNumbers(cells, fixedIndexes, availableNumbers) {
      const assignments = new Map();
      let remainingNumbers = [...availableNumbers];
      let openIndexes = [];
      let idx22 = fixedIndexes.find(index => manualAssignments[index] === 22) ?? -1;
      let idx23 = fixedIndexes.find(index => manualAssignments[index] === 23) ?? -1;
      let idx33 = fixedIndexes.find(index => manualAssignments[index] === 33) ?? -1;

      cells.forEach((cell, i) => {
        if (!cell.classList.contains("disabled") && !fixedIndexes.includes(i)) {
          openIndexes.push(i);
        }
      });

      if (idx22 === -1 && remainingNumbers.includes(22)) {
        let candidate22Spots = getValid22Spots(cells, fixedIndexes);

        if (idx23 !== -1) {
          const blockedBy23 = new Set(getNeighborIndexes(idx23));
          candidate22Spots = candidate22Spots.filter(index => index !== idx23 && !blockedBy23.has(index));
        }

        if (candidate22Spots.length > 0) {
          const chosenIndex = candidate22Spots[Math.floor(Math.random() * candidate22Spots.length)];
          idx22 = chosenIndex;
          assignments.set(chosenIndex, 22);
          remainingNumbers = remainingNumbers.filter(n => n !== 22);
          openIndexes = openIndexes.filter(index => index !== chosenIndex);
        }
      }

      if (idx33 === -1 && remainingNumbers.includes(33) && idx22 !== -1) {
        let candidate33Spots = getNeighborIndexes(idx22).filter(index => openIndexes.includes(index));

        if (idx23 !== -1) {
          candidate33Spots = candidate33Spots.filter(index => index !== idx23);
        }

        if (candidate33Spots.length > 0) {
          const chosenIndex = shuffle([...candidate33Spots])[0];
          idx33 = chosenIndex;
          assignments.set(chosenIndex, 33);
          remainingNumbers = remainingNumbers.filter(n => n !== 33);
          openIndexes = openIndexes.filter(index => index !== chosenIndex);
        }
      }

      if (idx23 === -1 && remainingNumbers.includes(23)) {
        let candidate23Spots = [...openIndexes];

        if (idx22 !== -1) {
          const blockedBy22 = new Set(getNeighborIndexes(idx22));
          candidate23Spots = candidate23Spots.filter(index => index !== idx22 && !blockedBy22.has(index));
        }

        if (candidate23Spots.length > 0) {
          const chosenIndex = shuffle([...candidate23Spots])[0];
          idx23 = chosenIndex;
          assignments.set(chosenIndex, 23);
          remainingNumbers = remainingNumbers.filter(n => n !== 23);
          openIndexes = openIndexes.filter(index => index !== chosenIndex);
        }
      }

      if (idx22 !== -1 && remainingNumbers.includes(10) && Math.random() < 0.6) {
        const candidate10Spots = getSideNeighborIndexes(idx22).filter(index => openIndexes.includes(index));

        if (candidate10Spots.length > 0) {
          const chosenIndex = shuffle([...candidate10Spots])[0];
          assignments.set(chosenIndex, 10);
          remainingNumbers = remainingNumbers.filter(n => n !== 10);
          openIndexes = openIndexes.filter(index => index !== chosenIndex);
        }
      }

      if (idx33 !== -1 && remainingNumbers.includes(11)) {
        const blockedBy33 = new Set(getNeighborIndexes(idx33));
        const candidate11Spots = openIndexes.filter(index => !blockedBy33.has(index));

        if (candidate11Spots.length > 0) {
          const chosenIndex = shuffle([...candidate11Spots])[0];
          assignments.set(chosenIndex, 11);
          remainingNumbers = remainingNumbers.filter(n => n !== 11);
          openIndexes = openIndexes.filter(index => index !== chosenIndex);
        }
      }

      const shuffledNumbers = shuffle(remainingNumbers);
      let numberIdx = 0;

      openIndexes.forEach(index => {
        assignments.set(index, shuffledNumbers[numberIdx++]);
      });

      cells.forEach((cell, i) => {
        if (cell.classList.contains("disabled") || fixedIndexes.includes(i)) return;
        cell.textContent = assignments.get(i) ?? "";
        cell.classList.add('fade-in');
        setTimeout(() => cell.classList.remove('fade-in'), 400);
      });
    }

    function randomizeBoard() {
      const cells = document.querySelectorAll(".cell");
      count++;
      document.getElementById("countVal").textContent = count;

      const activeCells = Array.from(cells).filter(c => !c.classList.contains("disabled"));
      const activeSeatsCount = activeCells.length;

      const fixedIndexes = Object.keys(manualAssignments).map(Number);
      const fixedNumbers = Object.values(manualAssignments);

      let availableNumbers = Array.from({ length: activeSeatsCount }, (_, i) => i + 1)
        .filter(n => !fixedNumbers.includes(n));

      placeNumbers(cells, fixedIndexes, availableNumbers);
    }
  </script>
</body>
</html>
